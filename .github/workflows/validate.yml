name: Validate website

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Parse content JSON
        run: node -e "const fs=require('fs'); for (const f of fs.readdirSync('content').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('content/'+f,'utf8')); console.log('JSON OK')"
      - name: Check required files
        run: test -f index.html && test -f assets/styles.css && test -f .pages.yml && test -f edit/index.html
